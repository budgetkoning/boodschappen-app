services:
  - type: web
    name: boodschappen-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boodschappen-db
          property: connectionString
databases:
  - name: boodschappen-db
    databaseName: boodschappen
    user: boodschappen
